services:
  - type: web
    name: sourcepoint
    runtime: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn sourcepoint.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: sourcepoint.settings
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
